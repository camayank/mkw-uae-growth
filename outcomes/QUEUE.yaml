# Build queue for the base product. Execute only the first outcome whose status is `released`.
# Statuses: planned → released → in-progress → verified-pending-merge → merged (set after the pull request lands on main).
# Later outcomes are `queued`; the owner releases each one after merging the previous pull request.
# Scope of each outcome = the features listed against it in docs/PRODUCT_SPEC.md, "Build plan".

baseline:
  id: O0
  title: Starter (core loop, security model, web app)
  status: verified
  evidence:
    - "pnpm test: 40 core + 28 API tests passing (16 Oct 2026)"
    - "scripts/smoke.mjs: full engagement in Chromium, no page errors, no money leaks"

outcomes:
  - id: O1
    title: Production foundation
    status: merged
    depends_on: [O0]
    contract: outcomes/O1-production-foundation.md
    needs_from_owner: [cloud account in a UAE region, domain name]
  - id: O2
    title: Notifications (email adapter, templates, in-app bell, ops digest)
    status: merged
    contract: outcomes/O2-notifications.md
    depends_on: [O1]
    needs_from_owner: [email provider account, DNS access for SPF and DKIM]
  - id: O3
    title: Payments and invoices (card links, signed webhook, tax invoices, payout runs, bank file)
    status: merged
    contract: outcomes/O3-payments-and-invoices.md
    depends_on: [O1, O2]
    needs_from_owner: [merchant account and keys, MKW TRN, sample bank bulk-transfer file]
  - id: O4
    title: Catalogue and fees (83 services, government fee table with sources, rules admin)
    status: merged
    contract: outcomes/O4-catalogue-and-fees.md
    depends_on: [O1]
    needs_from_owner: [named person who verifies fees and rules]
  - id: O5
    title: Scoping intelligence (structure, zone, licences, obligations with confidence; public intake; AI draft queue)
    status: merged
    contract: outcomes/O5-scoping-intelligence.md
    depends_on: [O4]
    needs_from_owner: [rule sign-off, AI API key and monthly spend cap]
  - id: O6
    title: Partners and delivery (onboarding, licence watch, scorecard, document requests, delay watch, ratings)
    status: merged
    contract: outcomes/O6-partners-and-delivery.md
    depends_on: [O1, O2]
    needs_from_owner: [service guarantee figure]
  - id: O7
    title: Launch gate (pilot with 3 partners and 5 clients, legal and tax sign-off, security review)
    status: prepared
    contract: outcomes/O7-launch-gate.md
    depends_on: [O3, O5, O6]
    needs_from_owner: [pilot partners and clients, lawyer, tax adviser]
  - id: O8
    title: Reporting and compliance calendar (dashboards, accounting export, client obligations)
    status: merged
    contract: outcomes/O8-reporting-and-compliance.md
    depends_on: [O7]
    needs_from_owner: [accounting system name]
  - id: O9
    title: Arabic and accessibility (Arabic client screens, right-to-left, WCAG 2.1 AA)
    status: merged
    contract: outcomes/O9-arabic-and-accessibility.md
    depends_on: [O7]
    needs_from_owner: [Arabic reviewer]
  - id: O10
    title: Real data and staging (importers for the go-live workbook, legal texts, holiday calendar, staging as code, console menu)
    status: merged
    contract: outcomes/O10-real-data-and-staging.md
    depends_on: [O9]
    needs_from_owner: [AWS account and credentials, domain and DNS, SES sender verification, named fee verifier, lawyer sign-off on client terms and partner agreement]
  - id: O11
    title: Ops command centre and event outbox
    status: verified-pending-merge
    contract: outcomes/O11-ops-command-centre.md
    depends_on: [O10]
    needs_from_owner: []

# Roadmap from docs/VISION.md (18 Oct 2026). Order of work: O11, O12, O13 before the pilot; then O7 (launch gate);
# then O14, O15, O16. Renumbered on 18 Oct 2026 when the owner released O10 as Real data and staging.
# Released by the owner on 25 Oct 2026, in order: O11, O12, O13, then O7 ("do all work properly").
# The rest are `planned`: the owner releases one at a time ("Release O11 ..."), and its contract
# file is written from the vision's scope at that point, before any code.
roadmap:
  - id: O12
    title: Client experience
    status: planned
    business_result: A client always knows the next action, and the offer reads as a proposal.
    scope: [engagement timeline with the next action pinned, proposal-style offer, conversational intake with the plan building on screen,
            checklist uploads with validation before upload, design tokens, web app split into modules with no build step]
    depends_on: [O11]
    needs_from_owner: [wording review of the proposal and intake questions]
  - id: O13
    title: Observability and hardening
    status: planned
    business_result: Nothing fails silently, and a retry never double-creates.
    scope: [structured logs with user, org and request id, job metrics and an alert when a job did not run, idempotency keys on mutating routes and jobs,
            state machines as data with one transition(), route modules and an OpenAPI contract, real Postgres in CI beside PGlite,
            load test on allocation and payouts, validated config at boot, verify:audit nightly]
    depends_on: [O11]
    needs_from_owner: [alerting destination]
  - id: O14
    title: Real payments and WhatsApp
    status: planned
    business_result: Clients pay by card through the chosen provider; reminders reach them where they read.
    scope: [payment provider adapter against its sandbox, WhatsApp adapter with opt-in, delivery log]
    depends_on: [O7]
    needs_from_owner: [payment provider and merchant account, WhatsApp Business number]
  - id: O15
    title: Books and Arabic completeness
    status: planned
    business_result: Finance imports without re-keying; Arabic covers PDFs and partners.
    scope: [accounting integration for the named system, Arabic invoice and offer PDFs, partner and staff screens in Arabic]
    depends_on: [O7]
    needs_from_owner: [accounting system name, Arabic reviewer]
  - id: O16
    title: Agents round two
    status: planned
    business_result: Ops time per engagement halves with no loss of control.
    scope: [fee and rule watcher, compliance calendar agent, partner vetting assistant, founder analyst over snapshot tables,
            learning-loop metrics (edit and acceptance rate per agent)]
    depends_on: [O11, O13, O7]
    needs_from_owner: [AI API key and monthly spend cap]
