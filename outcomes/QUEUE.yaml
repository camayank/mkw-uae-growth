# Roadmap from docs/VISION.md (18 Oct 2026). Order of work: O11, O12, O13 before the pilot; then O7 (launch gate);
# then O14, O15, O16. Renumbered on 18 Oct 2026 when the owner released O10 as Real data and staging.
# Released by the owner on 25 Oct 2026, in order: O11, O12, O13, then O7 ("do all work properly").
# The rest are `planned`: the owner releases one at a time ("Release O11 ..."), and its contract
# file is written from the vision's scope at that point, before any code.
roadmap:
  # The transformation mandate (3 Nov 2026), reconciled in docs/transformation/ROADMAP.md (T1): E21 follows E20 under
  # the mandate's instruction to continue with the next priority outcome; the owner can reorder or stop at any merge.
  - id: E21
    title: Remaining isolation and state rules
    status: planned
    business_result: Every download is proven refused to another party; every status change goes through one checked transition.
    scope: [refusal tests for the six download routes (gap 145), transition tables for request, payout and change order (gap 146), night-to-night audit chain length check (gap 143)]
    depends_on: [E20]
    needs_from_owner: []
  - id: E22
    title: Upload quarantine
    status: planned
    business_result: A file is checked for what it really is and held until scanned; a failed or missing scan never counts as clean.
    scope: [magic-byte checks per extension, quarantine state on file-bearing tables, scanner adapter with a memory double, downloads refused until clean]
    depends_on: [E20]
    needs_from_owner: [decision T6 (live scanner and its cost)]
  - id: E23
    title: Evidence operations
    status: planned
    business_result: Conflicting or changed facts are flagged to the verifier; stale facts reach the ops queue.
    scope: [conflict detection, version comparison, stale-fact queue items]
    depends_on: [E20]
    needs_from_owner: [a named verifier for real data (gap 92)]
  - id: E24
    title: AI provider adapter
    status: planned
    business_result: A real model behind a budget, a timeout and schema checks, with the deterministic model kept as fallback.
    scope: [live adapter behind configuration, monthly cap, timeouts, structured output validated by zod, capability status on screen]
    depends_on: [E20]
    needs_from_owner: [decision T5 (provider, API key, monthly cap, personal data)]
  - id: E25
    title: Agent tools and planning
    status: planned
    business_result: The agent reads a founder's goal, asks only what is missing and builds a plan from the existing engines.
    scope: [typed tool registry over existing services, agent identity no wider than the requesting user, launch plan]
    depends_on: [E21, E24]
    needs_from_owner: []
  - id: E26
    title: Agent execution and approval
    status: planned
    business_result: Agent runs persist, resume, stay within budget and stop at every consequential action for a person.
    scope: [run store, resume, idempotency, budgets, approval records, progress on screen]
    depends_on: [E25]
    needs_from_owner: []
  - id: E27
    title: Document intelligence
    status: planned
    business_result: Authorised uploads are read for type, fields and expiry, as a reviewer's checklist.
    scope: [content extraction after a clean scan, reviewer checklist, never auto-approving identity]
    depends_on: [E22, E24]
    needs_from_owner: []
  - id: E28
    title: Client journey (document reuse, priority speed)
    status: planned
    business_result: Documents reused with consent; the priority tier's speed carried into the offer and the plan.
    scope: [document reuse across steps with consent (gaps 34, 125), quoted working days in offer lines and milestone dates (gap 85)]
    depends_on: [E20]
    needs_from_owner: []
  - id: E29
    title: Agent evaluation and demonstration
    status: planned
    business_result: Thirty or more measured scenarios and a demonstration on synthetic data.
    scope: [evaluation suite with measured results, demo mode, docs/competition]
    depends_on: [E26]
    needs_from_owner: []
  - id: O14
    title: Real payments and WhatsApp
    status: planned
    business_result: Clients pay by card through the chosen provider; reminders reach them where they read.
    scope: [payment provider adapter against its sandbox, WhatsApp adapter with opt-in, delivery log]
    depends_on: [O7]
    needs_from_owner: [payment provider and merchant account, WhatsApp Business number]
  - id: O15
    title: Books and Arabic completeness
    status: planned
    business_result: Finance imports without re-keying; Arabic covers PDFs and partners.
    scope: [accounting integration for the named system, Arabic invoice and offer PDFs, partner and staff screens in Arabic]
    depends_on: [O7]
    needs_from_owner: [accounting system name, Arabic reviewer]
  - id: O16
    title: Agents round two
    status: planned
    business_result: Ops time per engagement halves with no loss of control.
    scope: [fee and rule watcher, compliance calendar agent, partner vetting assistant, founder analyst over snapshot tables,
            learning-loop metrics (edit and acceptance rate per agent)]
    depends_on: [O11, O13, O7]
    needs_from_owner: [AI API key and monthly spend cap]
    # E24 to E26 build the provider, tool registry, run store and approvals these agents need; proposal T7 in
    # docs/transformation/DECISION-LOG.md: O16 keeps the specific agents and depends on E26.
