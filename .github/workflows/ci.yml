name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  check:
    name: Typecheck, test, build, browser smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and API tests (PGlite, in memory; no network)
        run: pnpm test

      - name: Compile
        run: pnpm build

      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium

      - name: Seed demo data and start the compiled server
        run: |
          set -o pipefail
          if ! pnpm seed > seed.log 2>&1; then
            echo "::error title=seed failed::$(tail -c 1500 seed.log | tr '\n' ' ')"
            exit 1
          fi
          cd apps/api
          DEV_LOGIN=1 PAYMENT_WEBHOOK_SECRET=ci-secret PGLITE_DIR=./data/pglite LOG=0 \
            node --conditions=production dist/main.js > ../../smoke-server.log 2>&1 &
          echo $! > ../../smoke-server.pid
          # A cold runner loads the PGlite engine slowly: allow 90 s, then show the server log on failure.
          for i in $(seq 1 90); do curl -sf http://localhost:8787/api/health && break; sleep 1; done
          curl -sf http://localhost:8787/api/health || { echo "::error title=server did not answer::$(tail -c 1500 ../../smoke-server.log | tr '\n' ' ')"; exit 1; }

      - name: Browser smoke test against the compiled build
        run: OUT=./smoke-shots node scripts/smoke.mjs

      - name: Stop the server cleanly, then verify the audit chain of the smoke run
        run: |
          kill -TERM "$(cat smoke-server.pid)" && sleep 3
          PGLITE_DIR=./data/pglite pnpm verify:audit

      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence
          path: |
            smoke-shots/
            smoke-server.log
            seed.log
          if-no-files-found: ignore

  postgres:
    name: API tests, races and a load test on PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tasees
          POSTGRES_DB: postgres
          # A throwaway database inside the job: no password to keep anywhere.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasees" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://tasees@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: API tests on PostgreSQL (the race tests overlap for real here)
        run: pnpm --filter @tasees/api test

      - name: Load test on allocation and payouts (small; the full run is evidence in docs/evidence/O13)
        run: pnpm --filter @tasees/api load 40 10 "$GITHUB_WORKSPACE/load-test.md" && cat "$GITHUB_WORKSPACE/load-test.md" >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Container image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t tasees-platform:ci .
      - name: Image starts and answers health checks
        run: |
          docker run -d --name tasees -p 8787:8787 -e PAYMENT_WEBHOOK_SECRET=ci-webhook-secret-0123 tasees-platform:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8787/api/health && break; sleep 1; done
          curl -sf http://localhost:8787/api/health | grep '"ok":true'
          docker logs tasees

  infra:
    name: Staging infrastructure synthesises (no AWS call)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the infrastructure package on its own
        run: pnpm --dir infra install --frozen-lockfile --ignore-workspace
      - name: Typecheck and synthesise both stacks with example values
        run: pnpm --dir infra synth:check
